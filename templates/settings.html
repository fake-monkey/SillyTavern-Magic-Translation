<div class="magic-translation-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Magic Translation</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="openai_restorable flex-container">
                <div class="title_restorable">
                    <label>Connection Profile</label>
                    <button
                        class="menu_button fa-solid fa-route interactable redirect_sys_settings"
                        title="Go to connection profile tab"
                    ></button>
                </div>
                <select class="text_pole profile" title="Select a Connection Profile">
                    <option value="">Select a Connection Profile</option>
                </select>

                <label>Auto Mode</label>
                <select class="text_pole auto_mode">
                    <option data-i18n="ext_translate_mode_none" value="none">None</option>
                    <option data-i18n="ext_translate_mode_responses" value="responses">Translate responses</option>
                    <option data-i18n="ext_translate_mode_inputs" value="inputs">Translate inputs</option>
                    <option data-i18n="ext_translate_mode_both" value="both">Translate both</option>
                </select>

                <label>Target Language</label>
                <select class="text_pole target_language" title="Select a Target Language">
                    {{#each languageCodes}}
                    <option value="{{@key}}" {{#if this.selected}}selected{{/if}}>{{this.name}}</option>
                    {{/each}}
                </select>

                <div class="range-block">
                    <label class="checkbox_label widthFreeExpand">
                        <input type="checkbox" class="request_reasoning" />
                        <span data-i18n="Request model reasoning">Request model reasoning</span>
                    </label>
                    <div class="toggle-description justifyLeft marginBot5">
                        <span data-i18n="Allows the model to return its thinking process.">
                            Allows the model to return its thinking process.
                        </span>
                    </div>
                </div>

                <div class="flex-container flexFlowColumn wide100p textAlignCenter marginTop10">
                    <div class="flex-container oneline-dropdown">
                        <label>
                            <span data-i18n="Reasoning Effort">Reasoning Effort</span>
                        </label>
                        <select class="reasoning_effort">
                            <option data-i18n="openai_reasoning_effort_auto" value="auto">Auto</option>
                            <option data-i18n="openai_reasoning_effort_minimum" value="min">Minimum</option>
                            <option data-i18n="openai_reasoning_effort_low" value="low">Low</option>
                            <option data-i18n="openai_reasoning_effort_medium" value="medium">Medium</option>
                            <option data-i18n="openai_reasoning_effort_high" value="high">High</option>
                            <option data-i18n="openai_reasoning_effort_maximum" value="max">Maximum</option>
                        </select>
                        <div
                            class="toggle-description justifyLeft marginBot5"
                            data-i18n="OpenAI-compatible effort levels vary by model. Minimum and maximum may use model-specific aliases. Auto does not send an effort level."
                        >
                            OpenAI-compatible effort levels vary by model. Minimum and maximum may use model-specific
                            aliases. Auto does not send an effort level.
                        </div>
                    </div>
                </div>

                <label>Temperature (empty = use profile preset)</label>
                <input
                    type="number"
                    class="text_pole temperature"
                    step="0.05"
                    min="0"
                    max="2"
                    placeholder="Use profile preset"
                />

                <label>Top P (empty = use profile preset)</label>
                <input
                    type="number"
                    class="text_pole top_p"
                    step="0.05"
                    min="0"
                    max="1"
                    placeholder="Use profile preset"
                />

                <label>Max Response Length Multiplier</label>
                <input
                    type="number"
                    class="text_pole max_tokens_multiplier"
                    step="0.1"
                    min="0.1"
                    max="4"
                    value="1"
                />
                <div class="toggle-description justifyLeft marginBot5">
                    Translation limit = current Tavern response length × multiplier.
                </div>

                <div class="title_restorable">
                    <label>Prompt Preset</label>
                </div>
                <select class="text_pole prompt_preset" title="Select a Prompt"></select>

                <div class="title_restorable">
                    <label for="prompt">Prompt</label>
                    <button
                        class="menu_button fa-solid fa-undo interactable restore_default"
                        data-i18n="[title]Restore default"
                        title="Restore default"
                    ></button>
                </div>

                <textarea class="text_pole textarea_compact prompt" rows="4"></textarea>

                <div class="flex-container">
                    <label class="checkbox_label">
                        <input type="checkbox" class="filter_code_block" />
                        Filter Code Block: Get text between ``` marks (Recommended)
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
